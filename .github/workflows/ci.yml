name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Включить pnpm
        run: corepack enable pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Форматирование
        run: pnpm format:check

      - name: Линтер
        run: pnpm lint

      - name: Типы
        run: pnpm typecheck

      - name: Тесты
        run: pnpm test

      - name: Сборка
        run: pnpm build

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Образ собирается на каждом прогоне, чтобы несовместимости прод-сборки
      # всплывали в CI, а не на деплое.
      - name: Собрать образ API
        run: docker build -f apps/api/Dockerfile -t moneymap-api:${{ github.sha }} .
