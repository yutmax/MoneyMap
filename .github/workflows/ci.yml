name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Деплой отменять на полпути нельзя: он уже мог применить миграции.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Включить pnpm
        run: corepack enable pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Форматирование
        run: pnpm format:check

      - name: Линтер
        run: pnpm lint

      - name: Типы
        run: pnpm typecheck

      - name: Тесты
        run: pnpm test

      - name: Сборка
        run: pnpm build

      # Фронтенд собирается здесь, а не на сервере: там одно ядро, и сборка
      # Vite отняла бы его у работающего приложения.
      - name: Сохранить собранный фронтенд
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # В ветках и PR образ только собирается — чтобы несовместимости
      # прод-сборки всплывали в CI, а не на деплое. Публикуется он лишь
      # с master, которому и предстоит уехать на сервер.
      - name: Войти в GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и опубликовать образ API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          # Тег — это SHA коммита: по нему всегда видно, что именно работает
          # на сервере, и откат сводится к запуску предыдущего тега.
          tags: ghcr.io/${{ github.repository_owner }}/moneymap-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Environment с обязательным подтверждением: ничего не уезжает на сервер,
    # пока человек не нажмёт кнопку. Настраивается в Settings → Environments.
    environment:
      name: production
      url: ${{ vars.SITE_ADDRESS }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Забрать собранный фронтенд
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Настроить SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Отпечаток берётся из секрета, а не с сервера при первом
          # подключении: StrictHostKeyChecking=no принял бы и подменённый
          # хост, а деплой несёт секреты окружения.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Выгрузка образа и миграции идут молча минутами, а NAT между
          # раннером и сервером рвёт соединение, простоявшее без трафика
          # около пяти минут. Пустые пакеты держат его живым.
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 20\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Отправить файлы на сервер
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" 'mkdir -p /opt/moneymap/apps/web'
          scp -i ~/.ssh/id_deploy compose.prod.yml Caddyfile "$USER@$HOST:/opt/moneymap/"
          scp -i ~/.ssh/id_deploy scripts/deploy.sh "$USER@$HOST:/opt/moneymap/deploy.sh"
          # Статика заменяется целиком: старые ассеты с прошлыми хешами
          # в имени иначе накапливались бы без предела.
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            apps/web/dist/ "$USER@$HOST:/opt/moneymap/apps/web/dist/"

      - name: Развернуть
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/moneymap-api:${{ github.sha }}
        run: |
          # Токен прогона живёт только пока идёт этот workflow — долгого
          # пароля от реестра на сервере не остаётся.
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" \
            "chmod +x /opt/moneymap/deploy.sh && /opt/moneymap/deploy.sh '$IMAGE'"
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" 'docker logout ghcr.io'
