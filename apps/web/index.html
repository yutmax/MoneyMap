<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoneyMap</title>
    <meta
      name="description"
      content="Личный финансовый учёт с поддержкой нескольких валют и криптовалют."
    />

    <!--
      Тема применяется до первой отрисовки: если выставить data-theme из React,
      пользователь успеет увидеть вспышку чужой темы между загрузкой CSS
      и монтированием приложения.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('moneymap.theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved;
          }
        } catch (_) {
          /* приватный режим — остаётся системная тема */
        }
      })();
    </script>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
