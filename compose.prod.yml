# Продакшн: контейнеризировано всё (§4.2, §4.3).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER обязателен}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-moneymap}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуется: до БД достаёт только api по внутренней сети.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-moneymap}
      # Секреты передаются в рантайме и не запекаются в образ (§10.1).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET обязателен}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN обязателен}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?PUBLIC_WEB_URL обязателен}
      COOKIE_SECURE: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy

  # Миграции — отдельный шаг, а не часть старта приложения (§10.2):
  # при нескольких репликах api это была бы гонка.
  # Запуск: docker compose -f compose.prod.yml run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ['tools']
    command: ['node', 'dist/scripts/migrate.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-moneymap}
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      COOKIE_SECURE: 'true'
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN обязателен}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Статика фронтенда собирается на хосте (pnpm build) и монтируется сюда.
      - ./apps/web/dist:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
