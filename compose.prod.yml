# Продакшн: контейнеризировано всё (§4.2, §4.3).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER обязателен}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-moneymap}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуется: до БД достаёт только api по внутренней сети.

  api:
    # Образ собирается в CI и приходит готовым: на одноядерном сервере сборка
    # заняла бы минуты и могла не уложиться в память. build оставлен, чтобы
    # `docker compose build` работал локально.
    image: ${API_IMAGE:-moneymap-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-moneymap}
      # Секреты передаются в рантайме и не запекаются в образ (§10.1).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET обязателен}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN обязателен}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?PUBLIC_WEB_URL обязателен}
      COOKIE_SECURE: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy

  # Миграции — отдельный шаг, а не часть старта приложения (§10.2):
  # при нескольких репликах api это была бы гонка.
  # Запуск: docker compose -f compose.prod.yml run --rm migrate
  migrate:
    # Тот же образ, что и api: миграции лежат в нём, и запускать их другой
    # версией кода — верный способ применить не то, что ожидает приложение.
    image: ${API_IMAGE:-moneymap-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ['tools']
    command: ['node', 'dist/scripts/migrate.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-moneymap}
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      COOKIE_SECURE: 'true'
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # 443 не трогаем: он занят OpenVPN. 80 нужен только для челленджа
      # Let's Encrypt и редиректа на HTTPS.
      #
      # Docker публикует порты в обход ufw, добавляя свои правила ниже его
      # цепочек. Для Caddy это и требуется — он должен быть виден снаружи, —
      # но означает, что открытость этих двух портов задаётся здесь, а не
      # в ufw. Postgres поэтому и не публикуется вовсе: до него достаёт
      # только api по внутренней сети compose.
      - '80:80'
      - '8443:8443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS обязателен}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Статика фронтенда собирается на хосте (pnpm build) и монтируется сюда.
      - ./apps/web/dist:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
